[package]
name = "word-covenant"
version = "0.1.0"
description = "Local-first, auditable conversation records"
authors = ["WordCovenant contributors"]
edition = "2021"
repository = "https://github.com/nmgwddj/word-covenant"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "word_covenant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "WordCovenant"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
crossbeam-queue = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = { version = "2.7.2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-prevent-default = "5.0"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
webrtc-vad = "=0.4.0"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
cpal = "0.18"
mach2 = "0.6"
objc2 = "0.6"
objc2-av-foundation = { version = "0.3", default-features = false, features = ["AVCaptureDevice", "AVMediaFormat", "block2"] }
whisper-rs = { version = "=0.16.0", default-features = false, features = ["metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
whisper-rs = { version = "=0.16.0", default-features = false }

[profile.dev]
incremental = true # Compile your binary in smaller steps.

[profile.release]
codegen-units = 1 # Allows LLVM to perform better optimization.
lto = true        # Enables link-time-optimizations.
opt-level = "s"   # Prioritizes small binary size. Use `3` if you prefer speed.
panic = "abort"   # Higher performance by disabling panic handlers.
strip = true      # Ensures debug symbols are removed.
