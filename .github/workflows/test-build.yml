name: Build

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'tests/**'
      - 'models/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'src-tauri/Cargo.lock'
      - '.github/workflows/test-build.yml'
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-tauri:
    permissions:
      contents: read

    runs-on: 'macos-latest'
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      CMAKE_OSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v6.1.0

      - name: Install pnpm + deps
        uses: pnpm/action-setup@v6.0.10
        with:
          version: 10
          run_install: true

      - name: Use Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Fetch verified bundled ASR model for this build
        shell: bash
        run: |
          set -euo pipefail
          model_lock_path="models/whisper-base.lock.json"
          model_url="$(node -p "JSON.parse(require('node:fs').readFileSync('${model_lock_path}', 'utf8')).source.url")"
          model_sha256="$(node -p "JSON.parse(require('node:fs').readFileSync('${model_lock_path}', 'utf8')).sha256")"
          model_size="$(node -p "JSON.parse(require('node:fs').readFileSync('${model_lock_path}', 'utf8')).sizeBytes")"
          model_path="${RUNNER_TEMP}/ggml-base.bin"

          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 --retry-delay 2 --connect-timeout 20 --output "${model_path}" "${model_url}"
          test "$(stat -f '%z' "${model_path}")" = "${model_size}"
          printf '%s  %s\n' "${model_sha256}" "${model_path}" | shasum -a 256 -c -
          pnpm model:stage -- --source "${model_path}"

      - name: Build Tauri DMG
        run: pnpm tauri build --bundles dmg --target aarch64-apple-darwin

      - name: Verify the final packaged offline ASR resource
        shell: bash
        run: |
          set -euo pipefail
          dmg_directory="src-tauri/target/aarch64-apple-darwin/release/bundle/dmg"
          shopt -s nullglob
          dmg_paths=("${dmg_directory}"/*.dmg)
          test "${#dmg_paths[@]}" = '1'
          pnpm bundle:verify-macos -- "${dmg_paths[0]}"
