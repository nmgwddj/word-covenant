name: 'publish'

on:
  push:
    tags:
      - v*.*.*
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-tauri:
    permissions:
      contents: write

    runs-on: 'macos-latest'
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      CMAKE_OSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v6.1.0

      - name: Install pnpm + deps
        uses: pnpm/action-setup@v6.0.10
        with:
          version: 10
          run_install: true

      - name: Use Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Require the version-matched release tag
        id: release-tag
        shell: bash
        run: |
          set -euo pipefail
          release_tag="v$(node -p "JSON.parse(require('node:fs').readFileSync('src-tauri/tauri.conf.json', 'utf8')).version")"
          test "${GITHUB_REF_TYPE}" = 'tag'
          test "${GITHUB_REF_NAME}" = "${release_tag}"
          printf 'release_tag=%s\n' "${release_tag}" >> "${GITHUB_OUTPUT}"

      - name: Fetch verified bundled ASR model for this release build
        shell: bash
        run: |
          set -euo pipefail
          model_lock_path="models/whisper-base.lock.json"
          model_url="$(node -p "JSON.parse(require('node:fs').readFileSync('${model_lock_path}', 'utf8')).source.url")"
          model_sha256="$(node -p "JSON.parse(require('node:fs').readFileSync('${model_lock_path}', 'utf8')).sha256")"
          model_size="$(node -p "JSON.parse(require('node:fs').readFileSync('${model_lock_path}', 'utf8')).sizeBytes")"
          model_path="${RUNNER_TEMP}/ggml-base.bin"

          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 --retry-delay 2 --connect-timeout 20 --output "${model_path}" "${model_url}"
          test "$(stat -f '%z' "${model_path}")" = "${model_size}"
          printf '%s  %s\n' "${model_sha256}" "${model_path}" | shasum -a 256 -c -
          pnpm model:stage -- --source "${model_path}"

      - name: Build, verify, and upload the final offline ASR DMG
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pnpm tauri build --bundles dmg --target aarch64-apple-darwin
          dmg_directory="src-tauri/target/aarch64-apple-darwin/release/bundle/dmg"
          shopt -s nullglob
          dmg_paths=("${dmg_directory}"/*.dmg)
          test "${#dmg_paths[@]}" = '1'
          dmg_path="${dmg_paths[0]}"
          pnpm bundle:verify-macos -- "${dmg_path}"

          gh release create "${{ steps.release-tag.outputs.release_tag }}" "${dmg_path}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft \
            --verify-tag \
            --title "${{ steps.release-tag.outputs.release_tag }}" \
            --notes 'Draft WordCovenant macOS (Apple Silicon) build. It contains the reviewed offline Whisper base model and does not download a model while the application runs. Complete Developer ID signing and notarization before publishing this release.'
